<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MedicalStudy - Конструктор формул</title>
    <style>
        /* Стили как в предыдущей версии (оставлены такими же) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        h1 { color: #667eea; margin-bottom: 10px; }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover { text-decoration: underline; }
        .game-description {
            margin-bottom: 20px;
            padding: 15px;
            background: #f0f4ff;
            border-radius: 15px;
        }
        .construct-palette {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f7f9fc;
            border-radius: 20px;
            justify-content: center;
        }
        .group-piece {
            background: white;
            border: 2px solid #667eea;
            border-radius: 40px;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            cursor: grab;
            user-select: none;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .group-piece:active { cursor: grabbing; }
        .group-piece.dragging { opacity: 0.5; }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            background: #fff8e7;
            border: 3px solid #f59e0b;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .grid-cell {
            background: #fef3c7;
            border-radius: 16px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #92400e;
            border: 1px solid #f59e0b;
            transition: 0.2s;
            text-align: center;
            padding: 5px;
        }
        .grid-cell.drag-over {
            background: #ffedd5;
            border-color: #d97706;
            transform: scale(1.02);
        }
        .grid-cell.filled {
            background: #c4e0fa;
            border-color: #667eea;
            color: #2c3e66;
        }
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }
        .check-btn { background: #48bb78; color: white; }
        .reset-btn { background: #e53e3e; color: white; }
        button:hover { transform: translateY(-2px); }
        .message {
            margin-top: 20px;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            border-radius: 16px;
            }
        .message.success { background: #d4edda; color: #155724; }
        .message.error { background: #f8d7da; color: #721c24; }
        .molecule-selector {
            margin-bottom: 20px;
            padding: 10px;
            background: #eef2ff;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .molecule-selector label { font-weight: bold; }
        select {
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid #667eea;
            background: white;
            font-size: 16px;
            cursor: pointer;
        }
        @media (max-width: 700px) {
            .game-grid { gap: 6px; padding: 12px; }
            .grid-cell { font-size: 12px; }
            .group-piece { font-size: 14px; padding: 6px 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <a href="main.html" class="back-link">← Назад к курсам</a>
    <h1>🧩 Конструктор структурных формул</h1>

    <div class="molecule-selector">
        <label>Вещество:</label>
        <select id="moleculeSelect">
            <option value="alanine">Аланин (NH₂–CH(CH₃)–COOH)</option>
            <option value="glycine">Глицин (NH₂–CH₂–COOH)</option>
        </select>
        <span id="moleculeHint" style="color:#667eea; font-size:14px;"></span>
    </div>

    <div class="game-description" id="gameDescription">
        <!-- описание будет меняться в зависимости от выбранного вещества -->
    </div>

    <div class="construct-palette" id="palette">
        <!-- палитра будет заполнена динамически -->
    </div>

    <div class="game-grid" id="gameGrid"></div>

    <div class="controls">
        <button id="checkBtn" class="check-btn">✅ Проверить</button>
        <button id="resetBtn" class="reset-btn">🔄 Очистить поле</button>
    </div>
    <div id="message" class="message"></div>
</div>

<script>
    // ========== КОНФИГУРАЦИЯ ВЕЩЕСТВ ==========
    const MOLECULES = {
        alanine: {
            name: "Аланин",
            formula: "NH₂–CH(CH₃)–COOH",
            requiredFragments: { "NH₂": 1, "CH": 1, "CH₃": 1, "COOH": 1 },
            allowedFragments: ["NH₂", "CH", "CH₃", "COOH"],
            bonds: {
                // Какие связи разрешены (двунаправленные)
                "NH₂": ["CH"],
                "CH": ["NH₂", "COOH", "CH₃"],
                "COOH": ["CH"],
                "CH₃": ["CH"]
            },
            description: "Центральный атом (CH) связан с NH₂, COOH и CH₃. Метильная группа может быть в любом месте, но только прикреплена к CH."
        },
        glycine: {
            name: "Глицин",
            formula: "NH₂–CH₂–COOH",
            requiredFragments: { "NH₂": 1, "CH₂": 1, "COOH": 1 },
            allowedFragments: ["NH₂", "CH₂", "COOH"],
            bonds: {
                "NH₂": ["CH₂"],
                "CH₂": ["NH₂", "COOH"],
                "COOH": ["CH₂"]
            },
            description: "Цепочка из трёх фрагментов: NH₂–CH₂–COOH, они должны быть соединены последовательно."
        }
    };

    let currentMolecule = "alanine"; // текущее выбранное вещество
    let config = MOLECULES[currentMolecule];

    const GRID_SIZE = 5;
    let gridData = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(null));

    // Обновление палитры и описания в зависимости от выбранного вещества
    function updateUI() {
        config = MOLECULES[currentMolecule];
        // Обновляем описание
        document.getElementById('gameDescription').innerHTML = `
            <strong>Задание:</strong> Соберите формулу <strong>${config.name}</strong> — <code>${config.formula}</code>.<br>
            Перетащите фрагменты из палитры на поле 5x5.<br><br>
            ✅ <strong>Правила:</strong><br>
            • Используйте только фрагменты: ${config.allowedFragments.join(', ')} (каждый по одному разу).<br>
            • Все фрагменты должны быть соединены по правильным химическим связям (например, для аланина центральный CH связан с NH₂, COOH и CH₃).<br>
            • Все части должны образовывать одну связную группу (без разрывов).<br>
            • ${config.description}
        `;
        // Обновляем палитру: показываем все возможные фрагменты (включая лишние, но они будут отвергнуты)
        const paletteDiv = document.getElementById('palette');
        const allFragments = ["NH₂", "CH", "CH₃", "COOH", "OH", "CHO", "SH", "C₆H₅", "CH₂"];
        // Отфильтруем, чтобы не дублировать, но для выбранного вещества полезно показать и лишние (они будут вызывать ошибку)
        paletteDiv.innerHTML = '';
        allFragments.forEach(frag => {
            const piece = document.createElement('div');
            piece.className = 'group-piece';
            piece.setAttribute('draggable', 'true');
            piece.setAttribute('data-fragment', frag);
            piece.textContent = frag === 'C₆H₅' ? 'C₆H₅ (бензол)' : frag;
            paletteDiv.appendChild(piece);
        });
        initDragFromPalette();
        resetGame();
    }

    // Рендер сетки
    function renderGrid() {
        const gridContainer = document.getElementById('gameGrid');
        gridContainer.innerHTML = '';
        for (let i = 0; i < GRID_SIZE; i++) {
            for (let j = 0; j < GRID_SIZE; j++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                if (gridData[i][j] !== null) {
                    cell.textContent = gridData[i][j];
                    cell.classList.add('filled');
                } else {
                    cell.textContent = '⬚';
                }
                cell.setAttribute('data-row', i);
                cell.setAttribute('data-col', j);
                cell.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    cell.classList.add('drag-over');
                });
                cell.addEventListener('dragleave', () => {
                    cell.classList.remove('drag-over');
                });
                cell.addEventListener('drop', (e) => {
                    e.preventDefault();
                    cell.classList.remove('drag-over');
                    const fragment = e.dataTransfer.getData('text/plain');
                    if (fragment) {
                        const row = parseInt(cell.getAttribute('data-row'));
                        const col = parseInt(cell.getAttribute('data-col'));
                        gridData[row][col] = fragment;
                        renderGrid();
                        document.getElementById('message').innerHTML = '';
                        document.getElementById('message').className = 'message';
                    }
                });
                gridContainer.appendChild(cell);
            }
        }
    }

    function initDragFromPalette() {
        const pieces = document.querySelectorAll('#palette .group-piece');
        pieces.forEach(piece => {
            piece.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', piece.getAttribute('data-fragment'));
                e.dataTransfer.effectAllowed = 'copy';
                piece.classList.add('dragging');
            });
            piece.addEventListener('dragend', (e) => {
                piece.classList.remove('dragging');
            });
        });
    }

    function resetGame() {
        gridData = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(null));
        renderGrid();
        document.getElementById('message').innerHTML = '';
        document.getElementById('message').className = 'message';
    }
    // Проверка связности (BFS)
    function isConnected(positions) {
        if (positions.length === 0) return true;
        const posSet = new Set(positions.map(p => `${p.row},${p.col}`));
        const start = positions[0];
        const queue = [start];
        const visited = new Set();
        visited.add(`${start.row},${start.col}`);
        const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
        while (queue.length) {
            const {row, col} = queue.shift();
            for (let [dr, dc] of dirs) {
                const nr = row + dr;
                const nc = col + dc;
                const key = `${nr},${nc}`;
                if (posSet.has(key) && !visited.has(key)) {
                    visited.add(key);
                    queue.push({row: nr, col: nc});
                }
            }
        }
        return visited.size === positions.length;
    }

    // Проверка правильности связей по графу
    function checkBonds(occupied, fragmentMap) {
        // occupied: массив объектов {row, col, frag}
        // fragmentMap: Map от координаты к фрагменту
        // Собираем все рёбра (связи) между соседними фрагментами
        const edges = [];
        const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
        for (let i = 0; i < occupied.length; i++) {
            const a = occupied[i];
            for (let j = i+1; j < occupied.length; j++) {
                const b = occupied[j];
                const dist = Math.abs(a.row - b.row) + Math.abs(a.col - b.col);
                if (dist === 1) {
                    // связь между a.frag и b.frag
                    edges.push([a.frag, b.frag]);
                }
            }
        }
        // Проверяем каждую связь по правилам
        const bondsConfig = config.bonds;
        for (let [f1, f2] of edges) {
            // связь должна быть разрешена в конфигурации (в обе стороны)
            const ok = (bondsConfig[f1] && bondsConfig[f1].includes(f2)) ||
                       (bondsConfig[f2] && bondsConfig[f2].includes(f1));
            if (!ok) return false;
        }
        // Также нужно проверить, что количество связей для каждого фрагмента соответствует ожидаемому
        // (например, CH должен иметь 3 связи, NH₂ — 1 и т.д.) – это можно вывести из bondsConfig,
        // но для простоты проверим, что степени вершин соответствуют ожидаемым из bondsConfig (не лишние связи)
        // Подсчитаем степени
        const degree = {};
        for (let [f1, f2] of edges) {
            degree[f1] = (degree[f1] || 0) + 1;
            degree[f2] = (degree[f2] || 0) + 1;
        }
        // Ожидаемые степени: для аланина: CH:3, остальные:1; для глицина: CH₂:2, NH₂:1, COOH:1
        // Вычислим из bondsConfig (идеально, но можно прописать явно)
        // Здесь упростим: проверим, что нет изолированных фрагментов (все должны быть связаны) – уже проверено связностью.
        // Дополнительно: в аланине CH имел степень 3, если степень меньше – ошибка.
        const expectedDegrees = {};
        if (currentMolecule === 'alanine') {
            expectedDegrees['CH'] = 3;
            expectedDegrees['NH₂'] = 1;
            expectedDegrees['COOH'] = 1;
            expectedDegrees['CH₃'] = 1;
        } else if (currentMolecule === 'glycine') {
            expectedDegrees['CH₂'] = 2;
            expectedDegrees['NH₂'] = 1;
            expectedDegrees['COOH'] = 1;
        }
        for (let frag in expectedDegrees) {
            if ((degree[frag] || 0) !== expectedDegrees[frag]) return false;
        }
        return true;
    }

    function checkFormula() {
        // Собираем занятые клетки
        let occupied = [];
        let fragmentCount = {};
        for (let i = 0; i < GRID_SIZE; i++) {
            for (let j = 0; j < GRID_SIZE; j++) {
                const val = gridData[i][j];
                if (val !== null) {
                    occupied.push({row: i, col: j, frag: val});
                    fragmentCount[val] = (fragmentCount[val] || 0) + 1;
                }
            }
        }
        const totalCells = occupied.length;
        const requiredCount = Object.keys(config.requiredFragments).length;
        if (totalCells !== requiredCount) {
            document.getElementById('message').innerHTML = `❌ Неправильно: нужно ровно ${requiredCount} фрагментов (${config.allowedFragments.join(', ')}).`;
            document.getElementById('message').className = 'message error';
            return;
        }

        // Проверка, что все фрагменты – из разрешённых и каждый ровно один
        for (let frag in fragmentCount) {
            if (!config.allowedFragments.includes(frag)) {
                document.getElementById('message').innerHTML = `❌ Неправильно: фрагмент "${frag}" не входит в состав ${config.name}. Используйте только ${config.allowedFragments.join(', ')}.`;
                document.getElementById('message').className = 'message error';
                return;
            }
            if (fragmentCount[frag] !== config.requiredFragments[frag]) {
                document.getElementById('message').innerHTML = `❌ Неправильно: каждого фрагмента должно быть ровно по одному.`;
                document.getElementById('message').className = 'message error';
                return;
            }
        }

        // Проверка связности
        const positions = occupied.map(p => ({row: p.row, col: p.col}));
        if (!isConnected(positions)) {
            document.getElementById('message').innerHTML = '❌ Неправильно: все фрагменты должны быть соединены в одну группу (без разрывов).';
            document.getElementById('message').className = 'message error';
            return;
        }

        // Проверка правильности химических связей
        if (!checkBonds(occupied, new Map(occupied.map(p => [`${p.row},${p.col}`, p.frag])))) {
            document.getElementById('message').innerHTML = `❌ Неправильно: связи между фрагментами не соответствуют структуре ${config.name}. Проверьте, что фрагменты соединены правильно (например, центральный атом CH должен быть связан с NH₂, COOH и CH₃).`;
            document.getElementById('message').className = 'message error';
            return;
        }

        // Всё правильно
        document.getElementById('message').innerHTML = `✅ Правильно! Вы собрали формулу ${config.name}. Отличная работа!`;
        document.getElementById('message').className = 'message success';
    }

    // Обработка выбора вещества
    document.getElementById('moleculeSelect').addEventListener('change', (e) => {
        currentMolecule = e.target.value;
        updateUI();
    });

    // Инициализация
    updateUI();
    document.getElementById('checkBtn').addEventListener('click', checkFormula);
    document.getElementById('resetBtn').addEventListener('click', resetGame);
</script>
</body>
</html>
