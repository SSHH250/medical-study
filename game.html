<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MedicalStudy - Конструктор формул</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        h1 { color: #667eea; margin-bottom: 10px; }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover { text-decoration: underline; }
        
        /* Режимы */
        .mode-selector {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        .mode-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 40px;
            background: #ddd;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .mode-btn.active {
            background: #667eea;
            color: white;
        }
        .game-status {
            background: #eef2ff;
            padding: 10px 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .score-box {
            background: gold;
            padding: 5px 15px;
            border-radius: 30px;
            font-weight: bold;
        }
        .next-btn {
            background: #48bb78;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
        }
        .next-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .game-description {
            margin-bottom: 20px;
            padding: 15px;
            background: #f0f4ff;
            border-radius: 15px;
        }
        .construct-palette {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f7f9fc;
            border-radius: 20px;
            justify-content: center;
        }
        .group-piece {
            background: white;
            border: 2px solid #667eea;
            border-radius: 40px;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            cursor: grab;
            user-select: none;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .group-piece:active { cursor: grabbing; }
        .group-piece.dragging { opacity: 0.5; }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            background: #fff8e7;
            border: 3px solid #f59e0b;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .grid-cell {
            background: #fef3c7;
            border-radius: 16px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #92400e;
            border: 1px solid #f59e0b;
            transition: 0.2s;
            text-align: center;
            padding: 5px;
        }
        .grid-cell.drag-over {
            background: #ffedd5;
            border-color: #d97706;
            transform: scale(1.02);
        }
        .grid-cell.filled {
            background: #c4e0fa;
            border-color: #667eea;
            color: #2c3e66;
        }
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }
        .check-btn { background: #48bb78; color: white; }
        .reset-btn { background: #e53e3e; color: white; }
        button:hover { transform: translateY(-2px); }
        .message {
            margin-top: 20px;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            border-radius: 16px;
        }
        .message.success { background: #d4edda; color: #155724; }
        .message.error { background: #f8d7da; color: #721c24; }
        .molecule-selector {
            margin-bottom: 20px;
            padding: 10px;
            background: #eef2ff;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .molecule-selector label { font-weight: bold; }
        select {
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid #667eea;
            background: white;
            font-size: 16px;
            cursor: pointer;
        }
        @media (max-width: 700px) {
            .game-grid { gap: 6px; padding: 12px; }
            .grid-cell { font-size: 12px; }
            .group-piece { font-size: 14px; padding: 6px 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <a href="main.html" class="back-link">← Назад к курсам</a>
    <h1>🧩 Конструктор структурных формул</h1>

    <!-- Переключатель режимов -->
    <div class="mode-selector">
        <span style="font-weight: bold;">Режим:</span>
        <button id="trainModeBtn" class="mode-btn active">Тренировка</button>
        <button id="gameModeBtn" class="mode-btn">Игра (тест)</button>
        <div id="gameSettings" style="display: none; margin-left: auto;">
            <label>Количество заданий: </label>
            <input type="number" id="tasksCount" min="1" max="10" value="3" style="width: 70px; padding: 5px; border-radius: 20px; border: 1px solid #667eea;">
        </div>
    </div>

    <!-- Статус игры (отображается только в игровом режиме) -->
    <div id="gameStatus" class="game-status" style="display: none;">
        <span>Задание <span id="currentTaskIdx">1</span> из <span id="totalTasks">3</span></span>
        <span class="score-box">⭐ Счёт: <span id="scoreCount">0</span></span>
        <button id="nextTaskBtn" class="next-btn" disabled>Следующее вещество →</button>
    </div>

    <!-- Выбор вещества (только в тренировочном режиме) -->
    <div id="moleculeSelectorDiv" class="molecule-selector">
        <label>Вещество:</label>
        <select id="moleculeSelect">
            <option value="alanine">Аланин (NH₂–CH(CH₃)–COOH)</option>
            <option value="glycine">Глицин (NH₂–CH₂–COOH)</option>
        </select>
    </div>

    <div class="game-description" id="gameDescription">
        <!-- описание будет меняться -->
    </div>

    <div class="construct-palette" id="palette"></div>
    <div class="game-grid" id="gameGrid"></div>
    <div class="controls">
        <button id="checkBtn" class="check-btn">✅ Проверить</button>
        <button id="resetBtn" class="reset-btn">🔄 Очистить поле</button>
    </div>
    <div id="message" class="message"></div>
</div>

<script>
    // ========== КОНФИГУРАЦИЯ ВЕЩЕСТВ ==========
    const MOLECULES = {
        alanine: {
            name: "Аланин",
            formula: "NH₂–CH(CH₃)–COOH",
            requiredFragments: { "NH₂": 1, "CH": 1, "CH₃": 1, "COOH": 1 },
            allowedFragments: ["NH₂", "CH", "CH₃", "COOH"],
            bonds: {
                "NH₂": ["CH"],
                "CH": ["NH₂", "COOH", "CH₃"],
                "COOH": ["CH"],
                "CH₃": ["CH"]
            },
            description: "Центральный атом (CH) связан с NH₂, COOH и CH₃."
        },
        glycine: {
            name: "Глицин",
            formula: "NH₂–CH₂–COOH",
            requiredFragments: { "NH₂": 1, "CH₂": 1, "COOH": 1 },
            allowedFragments: ["NH₂", "CH₂", "COOH"],
            bonds: {
                "NH₂": ["CH₂"],
                "CH₂": ["NH₂", "COOH"],
                "COOH": ["CH₂"]
            },
            description: "Цепочка из трёх фрагментов: NH₂–CH₂–COOH."
        }
    };
    // Список всех возможных веществ для игры
    const ALL_MOLECULE_IDS = ["alanine", "glycine"];

    // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
    let currentMode = "train"; // "train" или "game"
    let currentMolecule = "alanine";
    let config = MOLECULES[currentMolecule];
    let gameTasks = []; // массив ID веществ для игрового режима
    let currentTaskIndex = 0;
    let gameScore = 0;
    let gameActive = false; // активно ли текущее задание (ожидаем проверки)
    let nextTaskEnabled = false; // можно ли перейти к следующему (после правильного ответа)

    const GRID_SIZE = 5;
    let gridData = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(null));

    // DOM элементы
    const trainModeBtn = document.getElementById('trainModeBtn');
    const gameModeBtn = document.getElementById('gameModeBtn');
    const gameStatusDiv = document.getElementById('gameStatus');
    const moleculeSelectorDiv = document.getElementById('moleculeSelectorDiv');
    const moleculeSelect = document.getElementById('moleculeSelect');
    const tasksCountInput = document.getElementById('tasksCount');
    const currentTaskIdxSpan = document.getElementById('currentTaskIdx');
    const totalTasksSpan = document.getElementById('totalTasks');
    const scoreCountSpan = document.getElementById('scoreCount');
    const nextTaskBtn = document.getElementById('nextTaskBtn');

    // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
    function resetGameField() {
        gridData = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(null));
        renderGrid();
        document.getElementById('message').innerHTML = '';
        document.getElementById('message').className = 'message';
    }

    function renderGrid() {
        const gridContainer = document.getElementById('gameGrid');
        gridContainer.innerHTML = '';
        for (let i = 0; i < GRID_SIZE; i++) {
            for (let j = 0; j < GRID_SIZE; j++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                if (gridData[i][j] !== null) {
                    cell.textContent = gridData[i][j];
                    cell.classList.add('filled');
                } else {
                    cell.textContent = '⬚';
                }
                cell.setAttribute('data-row', i);
                cell.setAttribute('data-col', j);
                cell.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    cell.classList.add('drag-over');
                });
                cell.addEventListener('dragleave', () => {
                    cell.classList.remove('drag-over');
                });
                cell.addEventListener('drop', (e) => {
                    e.preventDefault();
                    cell.classList.remove('drag-over');
                    const fragment = e.dataTransfer.getData('text/plain');
                    if (fragment) {
                        const row = parseInt(cell.getAttribute('data-row'));
                        const col = parseInt(cell.getAttribute('data-col'));
                        gridData[row][col] = fragment;
                        renderGrid();
                        const msgDiv = document.getElementById('message');
                        msgDiv.innerHTML = '';
                        msgDiv.className = 'message';
                    }
                });
                gridContainer.appendChild(cell);
            }
        }
    }

    function initDragFromPalette() {
        const pieces = document.querySelectorAll('#palette .group-piece');
        pieces.forEach(piece => {
            piece.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', piece.getAttribute('data-fragment'));
                e.dataTransfer.effectAllowed = 'copy';
                piece.classList.add('dragging');
            });
            piece.addEventListener('dragend', (e) => {
                piece.classList.remove('dragging');
            });
        });
    }

    // Обновление палитры и описания для текущего вещества
    function updateUIForCurrentMolecule() {
        config = MOLECULES[currentMolecule];
        document.getElementById('gameDescription').innerHTML = `
            <strong>Задание:</strong> Соберите формулу <strong>${config.name}</strong> — <code>${config.formula}</code>.<br>
            Используйте только фрагменты: ${config.allowedFragments.join(', ')} (каждый по одному разу).<br>
            Все фрагменты должны быть соединены правильно и образовывать связную группу.<br>
            ${config.description}
        `;
        // Обновляем палитру: показываем все возможные фрагменты (включая лишние)
        const allFragments = ["NH₂", "CH", "CH₃", "COOH", "OH", "CHO", "SH", "C₆H₅", "CH₂"];
        const paletteDiv = document.getElementById('palette');
        paletteDiv.innerHTML = '';
        allFragments.forEach(frag => {
            const piece = document.createElement('div');
            piece.className = 'group-piece';
            piece.setAttribute('draggable', 'true');
            piece.setAttribute('data-fragment', frag);
            piece.textContent = frag === 'C₆H₅' ? 'C₆H₅ (бензол)' : frag;
            paletteDiv.appendChild(piece);
        });
        initDragFromPalette();
        resetGameField();
    }

    // ========== ПРОВЕРКА ПРАВИЛЬНОСТИ (общая логика) ==========
    function isConnected(positions) {
        if (positions.length === 0) return true;
        const posSet = new Set(positions.map(p => `${p.row},${p.col}`));
        const start = positions[0];
        const queue = [start];
        const visited = new Set();
        visited.add(`${start.row},${start.col}`);
        const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
        while (queue.length) {
            const {row, col} = queue.shift();
            for (let [dr, dc] of dirs) {
                const nr = row + dr;
                const nc = col + dc;
                const key = `${nr},${nc}`;
                if (posSet.has(key) && !visited.has(key)) {
                    visited.add(key);
                    queue.push({row: nr, col: nc});
                }
            }
        }
        return visited.size === positions.length;
    }

    function checkBonds(occupied, fragmentMap, moleculeId) {
        const molConfig = MOLECULES[moleculeId];
        const bondsConfig = molConfig.bonds;
        // Собираем рёбра между соседями
        const edges = [];
        const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
        for (let i = 0; i < occupied.length; i++) {
            const a = occupied[i];
            for (let j = i+1; j < occupied.length; j++) {
                const b = occupied[j];
                const dist = Math.abs(a.row - b.row) + Math.abs(a.col - b.col);
                if (dist === 1) {
                    edges.push([a.frag, b.frag]);
                }
            }
        }
        // Проверяем каждую связь
        for (let [f1, f2] of edges) {
            const ok = (bondsConfig[f1] && bondsConfig[f1].includes(f2)) ||
                       (bondsConfig[f2] && bondsConfig[f2].includes(f1));
            if (!ok) return false;
        }
        // Проверяем степени (только для ключевых фрагментов, необязательно)
        const degree = {};
        for (let [f1, f2] of edges) {
            degree[f1] = (degree[f1] || 0) + 1;
            degree[f2] = (degree[f2] || 0) + 1;
        }
        if (moleculeId === 'alanine') {
            if ((degree['CH'] || 0) !== 3) return false;
            if ((degree['NH₂'] || 0) !== 1) return false;
            if ((degree['COOH'] || 0) !== 1) return false;
            if ((degree['CH₃'] || 0) !== 1) return false;
        } else if (moleculeId === 'glycine') {
            if ((degree['CH₂'] || 0) !== 2) return false;
            if ((degree['NH₂'] || 0) !== 1) return false;
            if ((degree['COOH'] || 0) !== 1) return false;
        }
        return true;
    }

    function checkCurrentFormula() {
        // Собираем занятые клетки
        let occupied = [];
        let fragmentCount = {};
        for (let i = 0; i < GRID_SIZE; i++) {
            for (let j = 0; j < GRID_SIZE; j++) {
                const val = gridData[i][j];
                if (val !== null) {
                    occupied.push({row: i, col: j, frag: val});
                    fragmentCount[val] = (fragmentCount[val] || 0) + 1;
                }
            }
        }
        const requiredCount = Object.keys(config.requiredFragments).length;
        if (occupied.length !== requiredCount) {
            showMessage(`Нужно ровно ${requiredCount} фрагментов (${config.allowedFragments.join(', ')}).`, false);
            return false;
        }
        for (let frag in fragmentCount) {
            if (!config.allowedFragments.includes(frag)) {
                showMessage(`Фрагмент "${frag}" не входит в состав ${config.name}. Используйте только ${config.allowedFragments.join(', ')}.`, false);
                return false;
            }
            if (fragmentCount[frag] !== config.requiredFragments[frag]) {
                showMessage(`Каждого фрагмента должно быть ровно по одному.`, false);
                return false;
            }
        }
        const positions = occupied.map(p => ({row: p.row, col: p.col}));
        if (!isConnected(positions)) {
            showMessage(`Все фрагменты должны быть соединены в одну группу (без разрывов).`, false);
            return false;
        }
        if (!checkBonds(occupied, null, currentMolecule)) {
            showMessage(`Связи между фрагментами не соответствуют структуре ${config.name}. Проверьте правильность соединений.`, false);
            return false;
        }
        showMessage(`✅ Правильно! Вы собрали формулу ${config.name}.`, true);
        return true;
    }

    function showMessage(msg, isSuccess) {
        const msgDiv = document.getElementById('message');
        msgDiv.innerHTML = msg;
        msgDiv.className = isSuccess ? 'message success' : 'message error';
    }

    // ========== ИГРОВОЙ РЕЖИМ ==========
    function initGameMode() {
        const tasksCount = parseInt(tasksCountInput.value) || 3;
        // Перемешиваем список веществ и берём первых tasksCount
        const shuffled = [...ALL_MOLECULE_IDS];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        gameTasks = shuffled.slice(0, tasksCount);
        currentTaskIndex = 0;
        gameScore = 0;
        gameActive = true;
        nextTaskEnabled = false;
        scoreCountSpan.textContent = gameScore;
        totalTasksSpan.textContent = gameTasks.length;
        currentTaskIdxSpan.textContent = currentTaskIndex + 1;
        nextTaskBtn.disabled = true;
        loadTask(gameTasks[currentTaskIndex]);
    }

    function loadTask(moleculeId) {
        currentMolecule = moleculeId;
        config = MOLECULES[currentMolecule];
        // Обновляем описание (без выбора вещества)
        document.getElementById('gameDescription').innerHTML = `
            <strong>Задание:</strong> Соберите формулу <strong>${config.name}</strong> — <code>${config.formula}</code>.<br>
            Используйте только фрагменты: ${config.allowedFragments.join(', ')} (каждый по одному разу).<br>
            Все фрагменты должны быть соединены правильно и образовывать связную группу.
        `;
        // Обновляем палитру
        const allFragments = ["NH₂", "CH", "CH₃", "COOH", "OH", "CHO", "SH", "C₆H₅", "CH₂"];
        const paletteDiv = document.getElementById('palette');
        paletteDiv.innerHTML = '';
        allFragments.forEach(frag => {
            const piece = document.createElement('div');
            piece.className = 'group-piece';
            piece.setAttribute('draggable', 'true');
            piece.setAttribute('data-fragment', frag);
            piece.textContent = frag === 'C₆H₅' ? 'C₆H₅ (бензол)' : frag;
            paletteDiv.appendChild(piece);
        });
        initDragFromPalette();
        resetGameField();
        nextTaskBtn.disabled = true;
        gameActive = true;
    }

    function onGameCorrect() {
        gameScore++;
        scoreCountSpan.textContent = gameScore;
        nextTaskBtn.disabled = false;
        showMessage(`✅ Правильно! +1 балл. Нажмите "Следующее вещество".`, true);
        gameActive = false;
    }

    function nextTask() {
        if (currentTaskIndex + 1 < gameTasks.length) {
            currentTaskIndex++;
            currentTaskIdxSpan.textContent = currentTaskIndex + 1;
            loadTask(gameTasks[currentTaskIndex]);
        } else {
            // Игра окончена
            gameStatusDiv.style.display = 'none';
            currentMode = 'train';
            trainModeBtn.classList.add('active');
            gameModeBtn.classList.remove('active');
            moleculeSelectorDiv.style.display = 'flex';
            document.getElementById('gameDescription').innerHTML =` <strong>🎉 Игра завершена! Ваш результат: ${gameScore} из ${gameTasks.length}.</strong><br>Выберите режим тренировки или начните новую игру.`;
            showMessage(`🏆 Игра окончена! Вы набрали ${gameScore} / ${gameTasks.length}.`, true);
            // Сброс поля и очистка
            resetGameField();
        }
    }

    // ========== ОБРАБОТЧИКИ ==========
    function switchMode(mode) {
        currentMode = mode;
        if (mode === 'train') {
            gameStatusDiv.style.display = 'none';
            moleculeSelectorDiv.style.display = 'flex';
            currentMolecule = moleculeSelect.value;
            config = MOLECULES[currentMolecule];
            updateUIForCurrentMolecule();
            trainModeBtn.classList.add('active');
            gameModeBtn.classList.remove('active');
        } else {
            gameStatusDiv.style.display = 'flex';
            moleculeSelectorDiv.style.display = 'none';
            trainModeBtn.classList.remove('active');
            gameModeBtn.classList.add('active');
            initGameMode();
        }
    }
    // Кнопка проверки
    document.getElementById('checkBtn').addEventListener('click', () => {
        if (currentMode === 'train') {
            checkCurrentFormula();
        } else if (currentMode === 'game' && gameActive) {
            const correct = checkCurrentFormula();
            if (correct) {
                onGameCorrect();
            } else {
                // остаёмся на том же задании
            }
        }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        resetGameField();
    });

    nextTaskBtn.addEventListener('click', () => {
        if (currentMode === 'game' && !nextTaskBtn.disabled) {
            nextTask();
        }
    });

    trainModeBtn.addEventListener('click', () => switchMode('train'));
    gameModeBtn.addEventListener('click', () => switchMode('game'));

    moleculeSelect.addEventListener('change', (e) => {
        if (currentMode === 'train') {
            currentMolecule = e.target.value;
            updateUIForCurrentMolecule();
        }
    });

    // Инициализация (тренировочный режим по умолчанию)
    updateUIForCurrentMolecule();
</script>
</body>
</html>
